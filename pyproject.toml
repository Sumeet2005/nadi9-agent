[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nadi9-agent"
version = "0.1.0"
description = "Evidence-grounded agentic subtitle decision system for the STAGE Nadi-9 assignment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sumeet Sonar" }
]

dependencies = [
    # Core AI / orchestration
    "langgraph>=0.6,<1.0",
    "langchain-core>=0.3,<1.0",

    # Data validation / configuration
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",

    # CLI
    "typer>=0.12,<1.0",

    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",

    # Persistence
    "sqlalchemy>=2.0,<3.0",

    # Real LLM provider
    "openai>=1.50,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
nadi9 = "nadi9.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

